<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attaché</title>

  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=12" />
</head>
<body>

  <header class="app-header">
    <div class="app-header__title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.2v5.6a2.6 2.6 0 0 1-5.2 0V4.6a1.7 1.7 0 0 1 3.4 0v6a.8.8 0 0 1-1.6 0V5.4"/></svg>
      <span>Attaché</span>
      <span id="attachmentCount" class="count-badge">0</span>
    </div>
    <div class="view-toggle">
      <button id="gridBtn" class="view-btn view-btn--active" aria-label="Grid view" aria-pressed="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>
      </button>
      <button id="listBtn" class="view-btn" aria-label="List view" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="2" height="2" rx=".5"/><rect x="5" y="2.25" width="8" height="1.5" rx=".75"/><rect x="1" y="6" width="2" height="2" rx=".5"/><rect x="5" y="6.25" width="8" height="1.5" rx=".75"/><rect x="1" y="10" width="2" height="2" rx=".5"/><rect x="5" y="10.25" width="8" height="1.5" rx=".75"/></svg>
      </button>
    </div>
  </header>

  <div id="controls" class="controls">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2l3.3 3.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search names and contents" />
    </div>
    <p id="searchStatus" class="search-status" hidden></p>

    <div id="typeChips" class="type-chips" role="group" aria-label="Filter by file type"></div>

    <div class="sort-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13V3M5 3L2.7 5.3M5 3l2.3 2.3M11 3v10M11 13l-2.3-2.3M11 13l2.3-2.3"/></svg>
      <select id="sortSelect" aria-label="Sort attachments">
        <option value="name-asc">Name (A to Z)</option>
        <option value="name-desc">Name (Z to A)</option>
        <option value="type">Type</option>
        <option value="size-desc">Size (largest first)</option>
      </select>
    </div>

  </div>

  <div id="bulkToolbar" class="bulk-toolbar" hidden>
    <span id="selectionCount"></span>
    <button id="downloadSelectedBtn" class="primary-btn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v7M8 9.5L5.3 6.8M8 9.5l2.7-2.7M3 13h10"/></svg>
      Download
    </button>
  </div>

  <main id="statusMessage" class="status-message">Loading attachments&hellip;</main>
  <main id="galleryContainer" class="gallery-container" hidden></main>

  <script type="text/javascript" src="extract.js?v=12"></script>
  <script type="text/javascript" src="taskpane.js?v=12"></script>
</body>
</html>
